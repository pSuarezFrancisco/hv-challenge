<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1200" height="680" fill="#fafafa" />
  <text x="16" y="22" font-size="16" font-weight="700" fill="#222222">Wireframe 2 — Submission bar, all three states</text>

  <g transform="translate(0,30)">
    <!-- State A: blocked -->
    <text x="16" y="16" font-size="13" font-weight="600" fill="#333333">State: blocked (critical and/or major issues present)</text>
    <rect x="0" y="30" width="1200" height="90" fill="#ffffff" stroke="#9e9e9e" />
    <rect x="16" y="42" width="1000" height="66" rx="4" fill="#fdecea" stroke="#d32f2f" />
    <circle cx="36" cy="75" r="10" fill="none" stroke="#d32f2f" />
    <text x="36" y="79" font-size="12" text-anchor="middle" fill="#d32f2f">!</text>
    <text x="56" y="68" font-size="12" fill="#b71c1c">2 critical and 3 major issues must be resolved before this review can be submitted.</text>
    <text x="56" y="88" font-size="11" fill="#999999">There are also 5 minor issues that don't need to be resolved before submitting.</text>
    <rect x="1040" y="58" width="144" height="36" rx="4" fill="#f0f0f0" stroke="#bbbbbb" stroke-dasharray="3 2" />
    <text x="1112" y="80" font-size="12" text-anchor="middle" fill="#999999">Submit review</text>
    <text x="1112" y="132" font-size="10" text-anchor="middle" fill="#2563eb">(disabled)</text>

    <!-- State B: ready -->
    <text x="16" y="176" font-size="13" font-weight="600" fill="#333333">State: ready to submit (no blocking issues; minor issues may remain)</text>
    <rect x="0" y="190" width="1200" height="90" fill="#ffffff" stroke="#9e9e9e" />
    <rect x="16" y="202" width="1000" height="66" rx="4" fill="#eaf6ea" stroke="#2e7d32" />
    <circle cx="36" cy="228" r="10" fill="none" stroke="#2e7d32" />
    <path d="M 31 228 L 35 232 L 42 224" fill="none" stroke="#2e7d32" stroke-width="2" />
    <text x="56" y="232" font-size="12" fill="#1b5e20">No blocking issues — this review is ready to submit.</text>
    <text x="56" y="250" font-size="11" fill="#999999">There are also 5 minor issues that don't need to be resolved before submitting.</text>
    <rect x="1040" y="218" width="144" height="36" rx="4" fill="#424242" />
    <text x="1112" y="240" font-size="12" text-anchor="middle" fill="#ffffff">Submit review</text>
    <text x="1112" y="292" font-size="10" text-anchor="middle" fill="#2563eb">(enabled)</text>

    <!-- State C: submitted -->
    <text x="16" y="336" font-size="13" font-weight="600" fill="#333333">State: submitted</text>
    <rect x="0" y="350" width="1200" height="90" fill="#ffffff" stroke="#9e9e9e" />
    <rect x="16" y="362" width="1000" height="66" rx="4" fill="#eaf6ea" stroke="#2e7d32" />
    <circle cx="36" cy="395" r="10" fill="none" stroke="#2e7d32" />
    <path d="M 31 395 L 35 399 L 42 391" fill="none" stroke="#2e7d32" stroke-width="2" />
    <text x="56" y="399" font-size="12" fill="#1b5e20">This review has been submitted.</text>
    <rect x="1040" y="378" width="144" height="36" rx="4" fill="#e0e0e0" stroke="#bbbbbb" />
    <text x="1112" y="400" font-size="12" text-anchor="middle" fill="#999999">Submitted</text>
    <text x="1112" y="452" font-size="10" text-anchor="middle" fill="#2563eb">(disabled — already submitted)</text>

    <line x1="16" y1="480" x2="1184" y2="480" stroke="#cccccc" />
    <text x="16" y="504" font-size="14" font-weight="600" fill="#333333">Notes</text>
    <text x="16" y="526" font-size="12" fill="#555555">The blocking-count line and the minor-count line are always visually separate — the urgent and informational messages don't compete for attention in one sentence.</text>
    <text x="16" y="546" font-size="12" fill="#555555">canSubmit = no critical/major issues present AND the review isn't already submitted.</text>
  </g>
</svg>
