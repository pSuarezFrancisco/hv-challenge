<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1200" height="560" fill="#fafafa" />
  <text x="16" y="22" font-size="16" font-weight="700" fill="#222222">Wireframe 3 — Loading and error states (full page)</text>

  <g transform="translate(0,30)">
    <!-- Loading panel -->
    <rect x="16" y="0" width="560" height="460" fill="#ffffff" stroke="#9e9e9e" />
    <text x="296" y="26" font-size="13" font-weight="600" fill="#333333" text-anchor="middle">Loading</text>
    <circle cx="296" cy="230" r="28" fill="none" stroke="#dddddd" stroke-width="4" />
    <path d="M 296 202 A 28 28 0 0 1 322 240" fill="none" stroke="#9e9e9e" stroke-width="4" stroke-linecap="round" />
    <text x="296" y="284" font-size="12" text-anchor="middle" fill="#777777">Loading review…</text>

    <!-- Error panel -->
    <rect x="624" y="0" width="560" height="460" fill="#ffffff" stroke="#9e9e9e" />
    <text x="904" y="26" font-size="13" font-weight="600" fill="#333333" text-anchor="middle">Error</text>
    <rect x="704" y="196" width="400" height="68" rx="4" fill="#fdecea" stroke="#d32f2f" />
    <circle cx="728" cy="230" r="10" fill="none" stroke="#d32f2f" />
    <text x="728" y="234" font-size="12" text-anchor="middle" fill="#d32f2f">!</text>
    <text x="748" y="226" font-size="13" fill="#b71c1c">Failed to load this</text>
    <text x="748" y="242" font-size="13" fill="#b71c1c">review.</text>
    <rect x="978" y="212" width="90" height="28" rx="4" fill="#ffffff" stroke="#b71c1c" />
    <text x="1023" y="230" font-size="11" text-anchor="middle" fill="#b71c1c">Retry</text>

    <line x1="16" y1="490" x2="1184" y2="490" stroke="#cccccc" />
    <text x="16" y="514" font-size="14" font-weight="600" fill="#333333">Notes</text>
    <text x="16" y="536" font-size="12" fill="#555555">Both states occupy the full viewport (no header/sidebar/PDF chrome yet) since the review hasn't loaded. Retry re-runs the same fetch that failed.</text>
  </g>
</svg>
