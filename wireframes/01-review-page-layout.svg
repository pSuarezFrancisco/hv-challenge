<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1170" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1440" height="1170" fill="#fafafa" />
  <text x="16" y="22" font-size="16" font-weight="700" fill="#222">Wireframe 1 — Review Page layout (blocked-submission state)</text>

  <g transform="translate(0,30)">
    <rect x="1" y="1" width="1438" height="898" fill="#ffffff" stroke="#bbbbbb" stroke-width="2" />

    <!-- Header -->
    <rect x="0" y="0" width="1440" height="64" fill="#ffffff" stroke="#9e9e9e" />
    <text x="24" y="28" font-size="16" font-weight="600" fill="#333333">Document name.pdf</text>
    <text x="24" y="48" font-size="12" fill="#777777">Uploaded by Jane Doe on Aug 1, 2026 · v3</text>
    <rect x="1320" y="20" width="100" height="24" rx="12" fill="none" stroke="#757575" />
    <text x="1370" y="36" font-size="11" fill="#555555" text-anchor="middle">On Review</text>

    <!-- Sidebar -->
    <line x1="380" y1="64" x2="380" y2="828" stroke="#9e9e9e" />

    <rect x="12" y="76" width="356" height="32" rx="4" fill="none" stroke="#9e9e9e" />
    <line x1="190" y1="76" x2="190" y2="108" stroke="#cccccc" />
    <text x="100" y="96" font-size="12" text-anchor="middle" fill="#333333">By severity</text>
    <text x="285" y="96" font-size="12" text-anchor="middle" fill="#777777">By page</text>

    <rect x="12" y="120" width="356" height="36" rx="4" fill="#ffffff" stroke="#9e9e9e" />
    <circle cx="28" cy="137" r="6" fill="none" stroke="#777777" />
    <line x1="32" y1="141" x2="37" y2="146" stroke="#777777" />
    <text x="44" y="142" font-size="12" fill="#999999">Search issues</text>

    <rect x="0" y="164" width="380" height="32" fill="#e0e0e0" />
    <text x="16" y="185" font-size="11" fill="#444444">CRITICAL (4)</text>
    <g fill="#333333">
      <circle cx="20" cy="224" r="4" fill="#9e9e9e" />
      <text x="36" y="220" font-size="13">Issue title placeholder</text>
      <text x="36" y="236" font-size="11" fill="#999999">Page 12</text>
      <line x1="0" y1="252" x2="380" y2="252" stroke="#eeeeee" />

      <circle cx="20" cy="280" r="4" fill="#9e9e9e" />
      <text x="36" y="276" font-size="13">Issue title placeholder</text>
      <text x="36" y="292" font-size="11" fill="#999999">Page 5</text>
      <line x1="0" y1="308" x2="380" y2="308" stroke="#eeeeee" />

      <circle cx="20" cy="336" r="4" fill="#9e9e9e" />
      <text x="36" y="332" font-size="13">Issue title placeholder</text>
      <text x="36" y="348" font-size="11" fill="#999999">Page 19</text>
      <line x1="0" y1="364" x2="380" y2="364" stroke="#eeeeee" />
    </g>

    <rect x="0" y="364" width="380" height="32" fill="#e0e0e0" />
    <text x="16" y="385" font-size="11" fill="#444444">MAJOR (8)</text>
    <g fill="#333333">
      <circle cx="20" cy="424" r="4" fill="#9e9e9e" />
      <text x="36" y="420" font-size="13">Issue title placeholder</text>
      <text x="36" y="436" font-size="11" fill="#999999">Page 3</text>
      <line x1="0" y1="452" x2="380" y2="452" stroke="#eeeeee" />

      <circle cx="20" cy="480" r="4" fill="#9e9e9e" />
      <text x="36" y="476" font-size="13">Issue title placeholder</text>
      <text x="36" y="492" font-size="11" fill="#999999">Page 21</text>
      <line x1="0" y1="508" x2="380" y2="508" stroke="#eeeeee" />

      <circle cx="20" cy="536" r="4" fill="#9e9e9e" />
      <text x="36" y="532" font-size="13">Issue title placeholder</text>
      <text x="36" y="548" font-size="11" fill="#999999">Page 27</text>
      <line x1="0" y1="564" x2="380" y2="564" stroke="#eeeeee" />
    </g>
    <text x="190" y="583" font-size="18" text-anchor="middle" fill="#bbbbbb">&#8942;</text>

    <rect x="0" y="592" width="380" height="32" fill="#e0e0e0" />
    <text x="16" y="613" font-size="11" fill="#444444">MINOR (13)</text>
    <path d="M 350 604 L 360 604 L 355 612 Z" fill="#777777" />
    <g fill="#333333">
      <circle cx="20" cy="652" r="4" fill="#9e9e9e" />
      <text x="36" y="648" font-size="13">Issue title placeholder</text>
      <text x="36" y="664" font-size="11" fill="#999999">Page 8</text>
      <line x1="0" y1="680" x2="380" y2="680" stroke="#eeeeee" />

      <circle cx="20" cy="708" r="4" fill="#9e9e9e" />
      <text x="36" y="704" font-size="13">Issue title placeholder</text>
      <text x="36" y="720" font-size="11" fill="#999999">Page 30</text>
      <line x1="0" y1="736" x2="380" y2="736" stroke="#eeeeee" />
    </g>
    <text x="16" y="758" font-size="11" fill="#999999">(scrolls further — 13 minor items collapse under one toggle)</text>

    <!-- Main / PDF area -->
    <rect x="660" y="130" width="500" height="640" fill="#ffffff" stroke="#9e9e9e" stroke-width="1.5" />
    <g stroke="#dddddd">
      <line x1="690" y1="160" x2="1130" y2="160" />
      <line x1="690" y1="182" x2="1090" y2="182" />
      <line x1="690" y1="204" x2="1120" y2="204" />
      <line x1="690" y1="226" x2="1000" y2="226" />
      <line x1="690" y1="248" x2="1110" y2="248" />
      <line x1="690" y1="270" x2="1080" y2="270" />
      <line x1="690" y1="292" x2="1130" y2="292" />
      <line x1="690" y1="314" x2="1050" y2="314" />
    </g>
    <rect x="690" y="350" width="420" height="40" fill="none" stroke="#2563eb" stroke-dasharray="4 2" />
    <g stroke="#dddddd">
      <line x1="690" y1="410" x2="1090" y2="410" />
      <line x1="690" y1="432" x2="1130" y2="432" />
      <line x1="690" y1="454" x2="1000" y2="454" />
      <line x1="690" y1="476" x2="1110" y2="476" />
      <line x1="690" y1="498" x2="1060" y2="498" />
    </g>

    <!-- Toolbar (page nav) -->
    <rect x="700" y="764" width="420" height="48" rx="24" fill="#ffffff" stroke="#9e9e9e" />
    <g stroke="#9e9e9e" fill="none">
      <rect x="722" y="778" width="20" height="20" rx="4" />
      <rect x="756" y="778" width="20" height="20" rx="4" />
    </g>
    <line x1="792" y1="772" x2="792" y2="804" stroke="#dddddd" />
    <rect x="808" y="778" width="36" height="20" rx="3" fill="none" stroke="#9e9e9e" />
    <text x="826" y="792" font-size="10" text-anchor="middle" fill="#666666">12</text>
    <text x="856" y="792" font-size="11" fill="#777777">of 34</text>
    <g stroke="#9e9e9e" fill="none">
      <rect x="900" y="778" width="20" height="20" rx="4" />
      <rect x="934" y="778" width="20" height="20" rx="4" />
    </g>
    <line x1="968" y1="772" x2="968" y2="804" stroke="#dddddd" />
    <g stroke="#9e9e9e" fill="none">
      <rect x="984" y="778" width="20" height="20" rx="4" />
      <rect x="1084" y="778" width="20" height="20" rx="4" />
    </g>

    <!-- Zoom pill -->
    <rect x="1284" y="764" width="140" height="48" rx="24" fill="#ffffff" stroke="#9e9e9e" />
    <rect x="1304" y="778" width="20" height="20" rx="4" fill="none" stroke="#9e9e9e" />
    <text x="1354" y="792" font-size="11" text-anchor="middle" fill="#777777">100%</text>
    <rect x="1394" y="778" width="20" height="20" rx="4" fill="none" stroke="#9e9e9e" />

    <!-- Submission bar -->
    <line x1="0" y1="828" x2="1440" y2="828" stroke="#9e9e9e" />
    <rect x="16" y="838" width="1180" height="48" rx="4" fill="#fdecea" stroke="#d32f2f" />
    <circle cx="36" cy="862" r="10" fill="none" stroke="#d32f2f" />
    <text x="36" y="866" font-size="12" text-anchor="middle" fill="#d32f2f">!</text>
    <text x="56" y="857" font-size="12" fill="#b71c1c">2 critical and 3 major issues must be resolved before this review can be submitted.</text>
    <text x="56" y="875" font-size="11" fill="#999999">There are also 5 minor issues that don't need to be resolved before submitting.</text>
    <rect x="1300" y="846" width="124" height="32" rx="4" fill="#f0f0f0" stroke="#bbbbbb" stroke-dasharray="3 2" />
    <text x="1362" y="866" font-size="12" text-anchor="middle" fill="#999999">Submit review</text>

    <!-- Annotation markers -->
    <g font-size="10" fill="#ffffff" text-anchor="middle">
      <circle cx="392" cy="70" r="9" fill="#2563eb" /><text x="392" y="73">1</text>
      <circle cx="355" cy="118" r="9" fill="#2563eb" /><text x="355" y="121">2</text>
      <circle cx="910" cy="754" r="9" fill="#2563eb" /><text x="910" y="757">3</text>
      <circle cx="1122" cy="345" r="9" fill="#2563eb" /><text x="1122" y="348">4</text>
      <circle cx="1354" cy="754" r="9" fill="#2563eb" /><text x="1354" y="757">5</text>
      <circle cx="1172" cy="844" r="9" fill="#2563eb" /><text x="1172" y="847">6</text>
      <circle cx="1298" cy="838" r="9" fill="#2563eb" /><text x="1298" y="841">7</text>
    </g>

    <!-- Notes panel -->
    <line x1="16" y1="910" x2="1424" y2="910" stroke="#cccccc" />
    <text x="16" y="934" font-size="14" font-weight="600" fill="#333333">Structural notes</text>
    <g font-size="12" fill="#555555">
      <circle cx="26" cy="954" r="8" fill="#2563eb" /><text x="26" y="958" font-size="10" fill="#ffffff" text-anchor="middle">1</text>
      <text x="44" y="958">Issue sidebar is a fixed 380px column, scrolling independently of the PDF pane.</text>

      <circle cx="26" cy="976" r="8" fill="#2563eb" /><text x="26" y="980" font-size="10" fill="#ffffff" text-anchor="middle">2</text>
      <text x="44" y="980">The search box and the active severity header stick to the top of the sidebar's own scroll as you scroll past them.</text>

      <circle cx="26" cy="998" r="8" fill="#2563eb" /><text x="26" y="1002" font-size="10" fill="#ffffff" text-anchor="middle">3</text>
      <text x="44" y="1002">The page-navigation toolbar floats over the PDF (absolutely positioned within the viewer pane), not part of document flow.</text>

      <circle cx="26" cy="1020" r="8" fill="#2563eb" /><text x="26" y="1024" font-size="10" fill="#ffffff" text-anchor="middle">4</text>
      <text x="44" y="1024">Every page's pdf.js text layer mounts immediately, so native Cmd+F/Ctrl+F matches text on pages never scrolled to — only the canvas image is deferred.</text>

      <circle cx="26" cy="1042" r="8" fill="#2563eb" /><text x="26" y="1046" font-size="10" fill="#ffffff" text-anchor="middle">5</text>
      <text x="44" y="1046">Zoom is a separate floating control from page navigation.</text>

      <circle cx="26" cy="1064" r="8" fill="#2563eb" /><text x="26" y="1068" font-size="10" fill="#ffffff" text-anchor="middle">6</text>
      <text x="44" y="1068">The submission banner states exact blocking counts (critical/major) with a separate, quieter line for non-blocking minor issues.</text>

      <circle cx="26" cy="1086" r="8" fill="#2563eb" /><text x="26" y="1090" font-size="10" fill="#ffffff" text-anchor="middle">7</text>
      <text x="44" y="1090">Submit stays disabled while any critical or major issue remains — shown here in the blocked state.</text>
    </g>
  </g>
</svg>
